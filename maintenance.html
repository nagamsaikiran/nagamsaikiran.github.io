<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Site Temporarily Unavailable - Sai Kiran</title>
    <meta name="description" content="Sai Kiran's portfolio is temporarily unavailable while updates are in progress.">
    <meta name="theme-color" content="#f8f6f1">

    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --bg: #f8f6f1;
            --accent: #2563eb;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --line: #d8d2c5;
            --shadow: 0 22px 60px rgba(15, 23, 42, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Syne', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg);
            overflow-x: hidden;
        }

        .grid-background {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(17, 24, 39, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(17, 24, 39, 0.035) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(620px, 100%);
            padding: 56px 44px;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .kicker {
            display: inline-block;
            margin-bottom: 24px;
            padding: 7px 14px;
            border: 1px solid #c7dcff;
            border-radius: 999px;
            background: #eef5ff;
            color: #1e3a8a;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.9rem, 5.5vw, 3rem);
            font-weight: 900;
            line-height: 1.08;
            color: var(--text-primary);
        }

        .message {
            max-width: 440px;
            margin: 20px auto 0;
            color: var(--text-secondary);
            font-size: 1.08rem;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 46px;
            margin-top: 32px;
            padding: 0 24px;
            border: 1px solid #111827;
            border-radius: 999px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Syne', sans-serif;
            font-size: 0.98rem;
            font-weight: 800;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .cta:hover {
            transform: translateY(-2px);
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
        }

        .cta:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.4);
            outline-offset: 3px;
        }

        @media (max-width: 560px) {
            main { padding: 40px 24px; }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <main>
        <span class="kicker">Portfolio Update</span>
        <h1>Site Temporarily Unavailable</h1>
        <p class="message">
            I am making a few updates and changes to the portfolio.
            Please check back soon.
        </p>
        <a class="cta" href="https://www.linkedin.com/in/saikirannagam" target="_blank" rel="noopener noreferrer">
            Connect on LinkedIn
        </a>
    </main>
</body>
</html>
